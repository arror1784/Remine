spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}

jwt:
  # No default on purpose: application.yml falls back to a committed dev secret so
  # local dev works out of the box, and anyone with the repo could forge tokens for
  # any account if that fallback ever reached prod. Overriding it here without a
  # default makes a prod boot fail fast when JWT_SECRET is missing.
  secret: ${JWT_SECRET}
