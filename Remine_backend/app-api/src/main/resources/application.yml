spring:
  application:
    name: remine-app-api
  profiles:
    active: dev
    # Always merges in application-local.yml if present (gitignored) — the local-only
    # override file for secrets like the H2 console password. Harmless if the file
    # doesn't exist. See application-local.yml.example for the expected keys.
    include: local
  datasource:
    # File-backed (not in-memory) so local data survives an app restart. AUTO_SERVER=TRUE
    # lets an external GUI client (TablePlus, DBeaver, ...) connect concurrently while the
    # app is running, using this same URL. Production still targets Postgres (see
    # application-prod.yml) — this only affects local dev.
    url: jdbc:h2:file:./data/remine;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    # Local-only — set H2_DB_PASSWORD in your shell profile (e.g. ~/.zshrc), never here.
    # The same value is what you type into the H2 console login (localhost:8080/h2-console).
    password: ${H2_DB_PASSWORD:}
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 8MB

# Local-disk image storage for memory-photo uploads (see LocalDiskImageStorageAdapter). No cloud
# storage is wired up yet — swap the adapter, not these keys, when one is.
storage:
  upload-dir: ${STORAGE_UPLOAD_DIR:./uploads}
  public-base-url: ${STORAGE_PUBLIC_BASE_URL:http://localhost:8080}

# Comma-separated browser origins allowed to call the API (see CorsConfig). Defaults cover the
# frontend's usual Vite dev ports; override in prod via CORS_ALLOWED_ORIGINS.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

jwt:
  secret: ${JWT_SECRET:dev-only-secret-key-change-in-production-0123456789}
  expiration-ms: 604800000

google:
  oauth:
    client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
    client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_OAUTH_REDIRECT_URI:}

openai:
  api-key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:gpt-4o-mini}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health
