name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./Remine_backend
          file: ./Remine_backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/remine-backend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/remine-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./Remine_frontend
          file: ./Remine_frontend/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            VITE_API_BASE_URL=/
          tags: |
            ghcr.io/${{ github.repository_owner }}/remine-frontend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/remine-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          script: |
            set -e
            cd /opt/remine
            git fetch --all
            git reset --hard origin/main
            export IMAGE_TAG=${{ github.sha }}
            docker compose --env-file /opt/remine.env -f docker-compose.prod.yml pull
            docker compose --env-file /opt/remine.env -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -af --filter "until=336h"
